<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App | Modern Notes Management</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- AOS Animation Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated Background -->
  <div class="animated-bg"></div>
  
  <div class="container py-4">
    <!-- HEADER WITH LOGO - Outside Cards -->
    <div class="text-center mb-5" data-aos="fade-down" data-aos-duration="800">
      <div class="logo-wrapper mb-3">
        <div class="logo-animation">
          <i class="fas fa-pen-fancy logo-icon"></i>
        </div>
      </div>
      <h1 class="app-title">
        <span class="gradient-text">SnipNote</span>
        <span class="badge bg-warning text-dark ms-3 animate-pulse">
          <i class="fas fa-magic me-1"></i> Premium
        </span>
      </h1>
      <p class="text-muted mt-2">Organize your thoughts beautifully</p>
    </div>

    <!-- FORM CARD - Add Note Section -->
    <div class="row justify-content-center mb-5" data-aos="fade-up" data-aos-duration="800">
      <div class="col-lg-6">
        <div class="card form-card border-0 shadow-lg">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <i class="fas fa-plus-circle fa-2x text-warning"></i>
              <h3 class="mt-2 mb-0">Create New Note</h3>
              <small class="text-muted">Express your thoughts</small>
            </div>
            
            <div class="form-section">
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="fas fa-heading me-2 text-warning"></i>Title
                </label>
                <input type="text" id="noteTitle" class="form-control form-control-lg" placeholder="What's this about?">
              </div>
              
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="fas fa-align-left me-2 text-warning"></i>Note Content
                </label>
                <textarea id="noteInput" class="form-control" rows="4" placeholder="Write your amazing ideas here..."></textarea>
              </div>
              
              <button onclick="addNote()" class="btn btn-primary btn-lg w-100 add-note-btn">
                <i class="fas fa-save me-2"></i>Save Note
                <i class="fas fa-arrow-right ms-2"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- NOTES SECTION - Grid Layout -->
    <div data-aos="fade-up" data-aos-duration="800" data-aos-delay="200">
      <div class="notes-header mb-4">
        <div>
          <h2 class="mb-0">
            <i class="fas fa-sticky-note me-2 text-warning"></i>
            Your Notes Collection
          </h2>
          <p class="text-muted mt-1">Beautifully organized for you</p>
        </div>
        <div>
          <span class="notes-count-badge" id="notesCount">
            <i class="fas fa-chart-simple me-1"></i>
            0 notes
          </span>
        </div>
      </div>
      
      <div class="notes-grid" id="notesList"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
  
  <script>
    // Initialize AOS animations
    AOS.init({
      once: true,
      offset: 100
    });
  </script>
</body>
</html>
